<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#253b2d"><title>Jaktlistan</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#223329;background:#f4f4ed}*{box-sizing:border-box}body{margin:0}header{background:#253b2d;color:#fff;padding:42px 20px 36px}header>div,main{max-width:860px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#c8d6ae;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(38px,8vw,58px);margin:8px 0}header p{color:#dce5d6;margin:0;line-height:1.5}main{padding:22px 16px 60px}.panel,.category{background:#fff;border:1px solid #e0e5d9;border-radius:16px;box-shadow:0 4px 20px #233c2910}.panel{padding:20px;margin-bottom:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:8px;background:#e8eee4;border-radius:5px;overflow:hidden;margin:14px 0 8px}.bar{height:100%;background:#789b56;transition:width .2s}small,.muted{color:#657468}button,input,select{font:inherit}button{cursor:pointer}.reset,.add{border:0;border-radius:9px;background:#344f39;color:white;padding:10px 15px;font-weight:650}.reset{background:#edf1e9;color:#354b38}.category{margin:12px 0;overflow:hidden}.cat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:#fafbf8}.cat-head h2{font-size:16px;margin:0}.count{font-size:12px;color:#718176}.item{display:flex;align-items:center;gap:12px;padding:13px 18px;border-top:1px solid #eef1eb}.item label{flex:1;cursor:pointer;line-height:1.35}.item.done label{text-decoration:line-through;color:#91a092}input[type=checkbox]{width:21px;height:21px;accent-color:#5e8050;cursor:pointer}.delete{border:0;background:none;color:#89968a;font-size:21px;padding:2px 6px}.delete:hover{color:#aa3d35}.form{display:flex;gap:8px;flex-wrap:wrap}input[type=text],select{border:1px solid #d6ded2;border-radius:9px;padding:11px;min-width:0;background:white;color:#253b2d}input[type=text]{flex:1 1 180px}select{flex:1 1 130px}.hint{font-size:13px;line-height:1.5;margin:14px 0 0}.foot{text-align:center;font-size:12px;color:#7b887c;margin-top:24px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a3bd88;outline-offset:2px}</style></head><body><header><div><div class="eyebrow">Din packlista för jakten</div><h1>Jaktlistan</h1><p>Packa lugnt. Bocka av. Kom ut i skogen.</p></div></header><main><section class="panel"><label for="hunt"><strong>Välj jaktform</strong></label><select id="hunt" style="display:block;width:100%;margin-top:10px"></select><p class="hint">Varje jaktform har en egen lista och egna avbockningar.</p></section><section class="panel"><div class="row"><div><strong id="status"></strong><div class="muted" style="font-size:13px;margin-top:4px" id="statusSub"></div></div><button class="reset" id="reset">Ny jakttur ↺</button></div><div class="progress"><div class="bar" id="bar"></div></div><small>Dina ändringar sparas automatiskt i den här webbläsaren.</small></section><section class="panel"><strong>Lägg till utrustning</strong><form class="form" id="form" style="margin-top:12px"><input type="text" id="name" placeholder="Till exempel termos" maxlength="100" required aria-label="Utrustning"><select id="category" aria-label="Kategori"></select><button class="add">Lägg till +</button></form></section><div id="lists"></div><p class="foot">Din lista är personlig · anpassa den efter jaktform och säsong</p></main><script>
const defaults={"Tillstånd & dokument":["Jaktkort / statligt jaktkort","Vapenlicens","Jakträtt / jaktinbjudan","Legitimation"],"Vapen & tillbehör":["Vapen","Ammunition","Hörselskydd","Vapenfodral","Kikarsikte / optik"],"Kläder & skydd":["Jaktjacka och byxor","Kängor","Signalfärg / jaktväst","Handskar och mössa","Extra lager och regnskydd"],"Ute i skogen":["Mobiltelefon","Jaktradio och laddat batteri","Kikare","Pannlampa och extra batteri","Första hjälpen","Vatten och matsäck","Karta / GPS","Sittunderlag eller jaktstol"],"Efter skottet":["Jaktkniv","Engångshandskar","Påsar för vilt / slaktavfall","Draglina / rep","Eftersökskontakt och telefonnummer"]};const oldKey='jaktlistan-v1',key='jaktlistan-v2';
const extras={"Passjakt":{"Ute i skogen":["Jaktstol med ryggstöd","Sittunderlag","Termos","Värmedyna"],"Kläder & skydd":["Extra värmande lager","Varma strumpor"]},"Aktiv jakt":{"Ute i skogen":["Lätt ryggsäck","Vattenflaska"],"Kläder & skydd":["Ombyte / extra strumpor"]},"Vakjakt":{"Ute i skogen":["Jaktstol","Termos","Myggmedel","Pannlampa med extra batteri"],"Kläder & skydd":["Varma och tysta kläder"]},"Eftersök":{"Ute i skogen":["Eftersökslina","Hundens utrustning","Extra belysning","Kontaktuppgifter till jaktledaren"],"Kläder & skydd":["Skyddsväst för hund vid behov"]}};
const types=['Min ursprungliga lista','Passjakt','Aktiv jakt','Vakjakt','Eftersök'];
function makeItems(type){let all=Object.entries(defaults).flatMap(([cat,names])=>names.map(name=>({id:crypto.randomUUID(),cat,name,done:false})));if(extras[type])for(const [cat,names] of Object.entries(extras[type]))for(const name of names)if(!all.some(x=>x.cat===cat&&x.name===name))all.push({id:crypto.randomUUID(),cat,name,done:false});return all}
let state;try{state=JSON.parse(localStorage.getItem(key));if(!state||!state.lists||!types.every(t=>state.lists[t]&&Array.isArray(state.lists[t].items)))throw 0}catch(e){let old=null;try{old=JSON.parse(localStorage.getItem(oldKey))}catch(_){}state={selected:types[0],lists:{}};for(const t of types)state.lists[t]={items:t===types[0]&&old&&Array.isArray(old.items)?old.items:makeItems(t)};try{localStorage.setItem(key,JSON.stringify(state))}catch(_){} }
if(!types.includes(state.selected))state.selected=types[0];let data=state.lists[state.selected];const hunt=document.querySelector('#hunt');types.forEach(t=>hunt.add(new Option(t,t)));hunt.value=state.selected;hunt.addEventListener('change',()=>{state.selected=hunt.value;data=state.lists[state.selected];save()});
const cats=Object.keys(defaults);const sel=document.querySelector('#category');cats.forEach(cat=>sel.add(new Option(cat,cat)));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){alert('Kunde inte spara i webbläsaren. Kontrollera lagringsinställningarna.')}render()}function render(){let done=data.items.filter(x=>x.done).length,total=data.items.length;document.querySelector('#status').textContent=`${done} av ${total} saker klara`;document.querySelector('#statusSub').textContent=total&&done===total?'Allt på listan är avbockat!':'Bocka av allt eftersom du packar.';document.querySelector('#bar').style.width=(total?done/total*100:0)+'%';let root=document.querySelector('#lists');root.replaceChildren();cats.forEach(cat=>{let items=data.items.filter(x=>x.cat===cat);let box=document.createElement('section');box.className='category';let head=document.createElement('div');head.className='cat-head';let title=document.createElement('h2');title.textContent=cat;let count=document.createElement('span');count.className='count';count.textContent=items.filter(i=>i.done).length+' / '+items.length;head.append(title,count);box.append(head);items.forEach(item=>{let row=document.createElement('div');row.className='item'+(item.done?' done':'');let check=document.createElement('input');check.type='checkbox';check.checked=item.done;check.id=item.id;check.addEventListener('change',()=>{item.done=check.checked;save()});let label=document.createElement('label');label.htmlFor=item.id;label.textContent=item.name;let del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','Ta bort '+item.name);del.onclick=()=>{if(confirm('Ta bort ”'+item.name+'” från listan?')){data.items=data.items.filter(x=>x.id!==item.id);save()}};row.append(check,label,del);box.append(row)});root.append(box)})}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let input=document.querySelector('#name'),name=input.value.trim();if(!name)return;data.items.push({id:crypto.randomUUID(),name,cat:sel.value,done:false});input.value='';save();input.focus()};document.querySelector('#reset').onclick=()=>{if(confirm('Nollställa avbockningarna för den valda jaktformen? Utrustningen och övriga listor finns kvar.')){data.items.forEach(x=>x.done=false);save()}};render();
</script></body></html>
